name: Release

# Pushing a tag like v1.2.0 builds the signed APK and publishes it as a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Check the tag matches the app version
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match versionName $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # The same git-ignored files a local release build uses, written from repository secrets.
      - name: Write signing and API key files
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PROPERTIES: ${{ secrets.KEYSTORE_PROPERTIES }}
          SPICY_PROPERTIES: ${{ secrets.SPICY_PROPERTIES }}
        run: |
          # Without the keystore the build would quietly sign with the debug key, and that APK
          # could not be installed over a real release.
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PROPERTIES" ]; then
            echo "Signing secrets are missing" >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > release.jks
          printf '%s\n' "$KEYSTORE_PROPERTIES" > keystore.properties
          printf '%s\n' "$SPICY_PROPERTIES" > spicy.properties

      - name: Test and build
        run: chmod +x gradlew && ./gradlew testDebugUnitTest assembleRelease

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="Syllable-$VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          notes="docs/releases/$VERSION.md"
          if [ -f "$notes" ]; then
            gh release create "$GITHUB_REF_NAME" "$apk" --title "Syllable $VERSION" --notes-file "$notes"
          else
            gh release create "$GITHUB_REF_NAME" "$apk" --title "Syllable $VERSION" --generate-notes
          fi

      - name: Remove the signing files
        if: always()
        run: rm -f release.jks keystore.properties spicy.properties
