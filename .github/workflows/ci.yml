name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # No signing key or API key here: this only proves the code builds and the tests pass.
      - run: chmod +x gradlew && ./gradlew testDebugUnitTest lintDebug assembleDebug
